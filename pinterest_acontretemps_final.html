  .topnav-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .topnav-icon:hover{background:var(--pin-lt)}
  .topnav-icon svg{width:20px;height:20px;color:var(--pin-dk)}
  .topnav-av{width:24px;height:24px;border-radius:50%;overflow:hidden;margin-left:4px;cursor:pointer}
  .topnav-av img{width:100%;height:100%;object-fit:cover}

  .profile{text-align:center;padding:24px 16px 0;max-width:600px;margin:0 auto}
  .pf-av{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 8px;background:#efefef}

  .tabs-bar{display:flex;justify-content:center;gap:8px;margin-top:20px}
  .tab-btn{padding:14px 8px 12px;font-size:15px;font-weight:600;color:var(--pin-dk);border:none;background:transparent;cursor:pointer;position:relative;font-family:inherit}

  .tab-btn.active::after{width:calc(100% - 8px)}
  .tab-btn:not(.active){color:var(--pin-gr);font-weight:500}

  .bf{display:flex;align-items:center;justify-content:space-between;max-width:1260px;margin:12px auto 0;padding:0 16px}
  .bf-left{display:flex;align-items:center;gap:8px}
  .bf-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .bf-icon:hover{background:var(--pin-lt)}
  .bf-icon svg{width:20px;height:20px}
  .bf-pill{height:32px;padding:0 16px;border-radius:16px;background:var(--pin-dk);color:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;border:none;font-family:inherit}
  .btn-cr{height:40px;padding:0 20px;border-radius:20px;background:var(--pin-red);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
  .btn-cr:hover{background:var(--pin-red-h)}

  .masonry{max-width:1260px;margin:16px auto 0;padding:0 8px;column-count:5;column-gap:8px}
  @media(max-width:1100px){.masonry{column-count:4}}
  @media(max-width:850px){.masonry{column-count:3}}
  @media(max-width:600px){.masonry{column-count:2;padding:0 4px;column-gap:4px}}

  .pin{break-inside:avoid;margin-bottom:8px;border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;position:relative}
  .pin:hover .pin-ov{opacity:1}
  .pin:hover .pin-sv{opacity:1}
  .pin:hover .pin-ac{opacity:1}
  .pin:hover .pin-bd{opacity:1}
  .pin-ic{position:relative;overflow:hidden}
  .pin-ic img{width:100%;display:block;border-radius:16px;transition:filter .2s}
  .pin:hover .pin-ic img{filter:brightness(.88)}
  .pin-ov{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:16px;opacity:0;transition:opacity .15s;pointer-events:none}
  .pin-sv{position:absolute;top:12px;right:12px;height:36px;padding:0 16px;border-radius:20px;background:var(--pin-red);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:inherit;opacity:0;transition:opacity .15s;z-index:2}

  .pin-ac{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;opacity:0;transition:opacity .15s;z-index:2}
  .pin-ab{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .pin-ab:hover{background:#fff}

  .pin-bd{position:absolute;bottom:12px;left:12px;background:rgba(255,255,255,.9);padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;color:var(--pin-dk);opacity:0;transition:opacity .15s;z-index:2;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .pin-tt{font-size:13px;font-weight:600;color:var(--pin-dk);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .pin-st{font-size:12px;color:var(--pin-gr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
